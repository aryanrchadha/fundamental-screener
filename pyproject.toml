[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamental-screener"
version = "0.1.0"
description = "Composite fundamental screener (Piotroski/Altman/Ohlson) on a point-in-time EDGAR database"
requires-python = ">=3.11"
dependencies = [
    "pit-fundamentals",
    "pandas>=2.0",
    "numpy>=1.26",
    "duckdb>=0.10",
    "requests>=2.31",
    "requests-cache>=1.1",
    "yfinance>=0.2.40",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "plotly>=5.20",
    "dash>=2.16",
    "lxml>=5.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["screener", "dashboard"]
py-modules = ["config"]

[tool.pytest.ini_options]
testpaths = ["tests", "pit_fundamentals/tests"]
